name: Notify Me of CI Results on My PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  checks: read
  pull-requests: write

concurrency:
  group: notify-self-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  notify-owner:
    if: github.event.pull_request.user.login == 'pnwilly'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Report the CI result for this push to the PR author
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const pr = context.payload.pull_request;
            const marker = `<!-- self-pr-notification ${pr.head.sha} -->`;
            const commit = pr.head.sha.slice(0, 7);
            const wait = (seconds) => new Promise((resolve) => setTimeout(resolve, seconds * 1000));
            const failed = ["failure", "cancelled", "timed_out", "action_required", "startup_failure"];

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            if (comments.some((comment) => comment.body?.includes(marker))) {
              return;
            }

            // Let the other workflows and CodeQL register their checks, then wait for them.
            await wait(30);
            const deadline = Date.now() + 20 * 60 * 1000;
            let others = [];
            for (;;) {
              const runs = await github.paginate(
                github.rest.checks.listForRef,
                { owner, repo, ref: pr.head.sha, per_page: 100 }
              );
              others = runs.filter((run) => run.name !== context.job);
              if (others.every((run) => run.status === "completed") || Date.now() > deadline) {
                break;
              }
              await wait(20);
            }

            const running = others.filter((run) => run.status !== "completed").map((run) => run.name);
            const failures = others.filter((run) => failed.includes(run.conclusion)).map((run) => run.name);
            const summary = running.length
              ? `CI still running after 20 minutes on ${commit}: ${running.join(", ")}.`
              : failures.length
                ? `CI failed on ${commit}: ${failures.join(", ")}.`
                : others.length
                  ? `CI passed on ${commit}.`
                  : `No CI checks ran on ${commit}.`;

            // GitHub does not notify me of my own PRs. The first result notifies through the
            // assignment; later results notify through a mention, since a repeat assignment is silent.
            const assigned = pr.assignees?.some((assignee) => assignee.login === pr.user.login);
            if (!assigned) {
              await github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number,
                assignees: [pr.user.login],
              });
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: assigned ? `${marker}\n@${pr.user.login} ${summary}` : `${marker}\n${summary}`,
            });
